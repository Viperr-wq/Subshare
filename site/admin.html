<!doctype html>
<!--
  Статистика для команды SubShare: сколько аккаунтов и кто они.
  Ссылки на эту страницу на сайте нет. Данные видят только номера из ADMIN_PHONES (DEPLOY.md).
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SubShare — статистика</title>
    <link rel="icon" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="admin">
    <header class="header">
      <div class="container header-row">
        <a class="brand" href="index.html"><span class="logo" aria-hidden="true">S</span>SubShare</a>
      </div>
    </header>

    <main class="container admin-main">
      <h1>Статистика</h1>
      <p id="status">Загрузка…</p>

      <div id="stats" hidden>
        <div class="stat-cards">
          <div class="stat"><b id="accounts">0</b><span>аккаунтов</span></div>
          <div class="stat"><b id="new-week">0</b><span>новых за 7 дней</span></div>
          <div class="stat"><b id="invited">0</b><span>приглашены, ещё не входили</span></div>
          <div class="stat"><b id="groups">0</b><span>групп подписок</span></div>
        </div>

        <h2>Аккаунты</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Язык</th>
                <th>Групп</th>
                <th>Появился</th>
              </tr>
            </thead>
            <tbody id="clients"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="translations.js" defer></script>
    <script src="script.js" defer></script>
    <script src="admin.js" defer></script>
  </body>
</html>
